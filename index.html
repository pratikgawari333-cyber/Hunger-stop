<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ऑल-इन-वन डिलिव्हरी हब</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f9; text-align: center; }
        header { background-color: #ff5200; color: white; padding: 15px; font-size: 20px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; max-width: 500px; margin: auto; }
        .card { background: white; padding: 25px 15px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); text-decoration: none; color: #333; font-weight: bold; font-size: 18px; }
        .zomato { border-top: 5px solid #e23744; }
        .swiggy { border-top: 5px solid #fc8019; }
        .blinkit { border-top: 5px solid #f8cb46; }
        .zepto { border-top: 5px solid #3b006a; }
    </style>
</head>
<body>

<header>सर्व डिलिव्हरी अ‍ॅप्स एकाच ठिकाणी</header>

<div class="grid">
    <a href="https://zomato.com" target="_blank" class="card zomato">🍔 Zomato<br><small>जेवण ऑर्डर करा</small></a>
    <a href="https://swiggy.com" target="_blank" class="card swiggy">🍕 Swiggy<br><small>फूड आणि इंस्टामार्ट</small></a>
    <a href="https://blinkit.com" target="_blank" class="card blinkit">🥦 Blinkit<br><small>१० मिनिटांत किराणा</small></a>
    <a href="https://zeptonow.com" target="_blank" class="card zepto">🛒 Zepto<br><small>झटपट डिलिव्हरी</small></a>
</div>

</body>
</html>
