<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hunger-stop - सुपर डिलिव्हरी आणि ऑफर्स हब</title>
    <style>
        :root {
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #222222;
            --subtext-color: #666666;
            --border-color: #eeeeee;
            --primary: #ff5200;
            --accent: #28a745;
        }
        body.dark-mode {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --subtext-color: #aaaaaa;
            --border-color: #333333;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; transition: background-color 0.2s, color 0.2s; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 85px; }
        
        /* Header & Custom Logo */
        header { background: linear-gradient(135deg, #ff5200, #e23744); color: white; padding: 14px 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .header-top { display: flex; justify-content: space-between; align-items: center; max-width: 600px; margin: auto; }
        .brand { display: flex; align-items: center; gap: 10px; text-align: left; }
        .brand h1 { font-size: 20px; font-weight: 800; letter-spacing: 0.5px; }
        .brand p { font-size: 11px; opacity: 0.9; }
        
        .top-controls { display: flex; gap: 6px; }
        .ctrl-btn { background: rgba(255,255,255,0.2); color: white; border: 1px solid rgba(255,255,255,0.4); padding: 5px 9px; border-radius: 16px; font-size: 11px; font-weight: bold; cursor: pointer; }
        .ctrl-btn.wa { background: #25D366; border: none; }

        /* Flash Deal Timer */
        .timer-banner { background: #1a1a1a; color: #ffd700; padding: 7px 12px; font-size: 12px; font-weight: bold; text-align: center; display: flex; justify-content: center; align-items: center; gap: 8px; }
        .timer-box { background: #e23744; color: white; padding: 2px 6px; border-radius: 4px; font-family: monospace; font-size: 13px; }

        /* Search Bar */
        .search-box { padding: 10px 15px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); }
        .search-box input { width: 100%; max-width: 600px; display: block; margin: auto; padding: 9px 14px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 25px; font-size: 14px; outline: none; }

        /* Category Tabs */
        .tabs { display: flex; overflow-x: auto; background: var(--card-bg); padding: 10px 15px; gap: 8px; border-bottom: 1px solid var(--border-color); justify-content: flex-start; }
        .tab-btn { padding: 7px 14px; border: none; border-radius: 20px; background: var(--bg-color); color: var(--text-color); font-weight: bold; font-size: 12px; cursor: pointer; white-space: nowrap; }
        .tab-btn.active { background: #ff5200; color: white; }

        /* Sections */
        .section { display: none; padding: 15px; max-width: 600px; margin: auto; }
        .section.active { display: block; }

        /* App Grid */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .card { position: relative; background: var(--card-bg); padding: 24px 10px 14px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.08); text-decoration: none; color: var(--text-color); text-align: center; display: block; border: 1px solid var(--border-color); }
        .card:active { transform: scale(0.97); }
        .card.hot-deal { border: 2px solid #28a745; }
        
        .offer-tag { position: absolute; top: 0; right: 0; background: #e23744; color: white; font-size: 10px; font-weight: bold; padding: 3px 7px; border-radius: 0 10px 0 10px; }
        .offer-tag.green { background: #28a745; }
        .offer-tag.orange { background: #ff5200; }

        .time-tag { position: absolute; top: 5px; left: 7px; font-size: 10px; color: var(--subtext-color); font-weight: bold; }
        .card .icon { font-size: 28px; margin-bottom: 5px; display: block; }
        .card strong { font-size: 15px; display: block; }
        .card small { font-size: 11px; color: var(--subtext-color); display: block; margin-top: 2px; }
        .offer-detail { margin-top: 6px; font-size: 11px; font-weight: bold; color: #28a745; background: rgba(40,167,69,0.12); padding: 3px 7px; border-radius: 6px; display: inline-block; }

        /* Local Shop Promo */
        .local-box { background: linear-gradient(135deg, rgba(255,140,0,0.15), rgba(255,82,0,0.1)); border: 1px dashed #ff8c00; padding: 14px; border-radius: 12px; margin-top: 18px; }
        .local-box h4 { color: #ff5200; font-size: 15px; margin-bottom: 5px; }
        .local-box p { font-size: 12px; color: var(--text-color); margin-bottom: 10px; }
        .wa-btn { display: inline-block; background: #25D366; color: white; text-decoration: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; }

        /* Boxes & Tools */
        .box { background: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 15px; border: 1px solid var(--border-color); }
        .box input, .box select { width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid var(--border-color); background: var(--bg-color); color: var(--text-color); border-radius: 8px; font-size: 14px; }
        .action-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; }
        
        .wheel-display { font-size: 18px; font-weight: bold; color: #ff5200; background: rgba(255,82,0,0.1); padding: 14px; border-radius: 10px; margin: 12px 0; border: 2px dashed #ff5200; text-align: center; }
        .comp-item { padding: 12px; border-radius: 8px; border: 1px solid var(--border-color); margin-top: 10px; display: flex; justify-content: space-between; align-items: center; }
        .comp-item.best { border: 2px solid #28a745; background-color: rgba(40,167,69,0.1); }
        .badge { background: #28a745; color: white; font-size: 10px; padding: 3px 7px; border-radius: 10px; font-weight: bold; }

        /* Coupons */
        .coupon-card { background: var(--card-bg); padding: 14px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid #28a745; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); border-right: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); }
        .bank-card { border-left-color: #007bff; }
        .coupon-info h4 { font-size: 14px; margin-bottom: 3px; }
        .coupon-info p { font-size: 12px; color: var(--subtext-color); }
        .copy-btn { background: #28a745; color: white; border: none; padding: 7px 11px; border-radius: 6px; font-weight: bold; font-size: 12px; cursor: pointer; }

        /* Lists */
        .item-list { list-style: none; margin-top: 10px; }
        .item-list li { display: flex; justify-content: space-between; align-items: center; padding: 10px 5px; border-bottom: 1px solid var(--border-color); font-size: 14px; }
        .total-banner { background: rgba(255,193,7,0.2); padding: 12px; border-radius: 8px; text-align: center; font-weight: bold; margin: 12px 0; color: #d39e00; }

        /* Bottom Navigation */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); display: flex; justify-content: space-around; padding: 8px 0; border-top: 1px solid var(--border-color); box-shadow: 0 -2px 5px rgba(0,0,0,0.08); z-index: 100; }
        .nav-item { text-align: center; font-size: 10px; color: var(--subtext-color); cursor: pointer; border: none; background: none; }
        .nav-item.active { color: #ff5200; font-weight: bold; }
        .nav-item span { display: block; font-size: 17px; margin-bottom: 2px; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand">
            <!-- Custom SVG Logo for Hunger-stop -->
            <svg width="42" height="42" viewBox="0 0 64 64" fill="none" xmlns="http://w3.org">
                <rect width="64" height="64" rx="16" fill="#FFFFFF"/>
                <path d="M16 28C16 20 23 15 32 15C41 15 48 20 48 28H16Z" fill="#FF8C00"/>
                <rect x="14" y="31" width="36" height="5" rx="2.5" fill="#28A745"/>
                <rect x="15" y="38" width="34" height="5" rx="2.5" fill="#8B4513"/>
                <path d="M16 45H48C48 49 44 51 32 51C20 51 16 49 16 45Z" fill="#FF8C00"/>
                <circle cx="50" cy="14" r="7" fill="#E23744"/>
                <path d="M48 14L50 11L53 14H51V17H49V14H48Z" fill="white"/>
            </svg>
            <div>
                <h1>Hunger-stop</h1>
                <p id="subTitle">सर्व ऑफर्स आणि तुलना एकाच ठिकाणी</p>
            </div>
        </div>
        <div class="top-controls">
            <button class="ctrl-btn" onclick="toggleLang()" id="langBtn">EN / म</button>
            <button class="ctrl-btn" onclick="toggleDarkMode()" id="themeBtn">🌙</button>
            <button class="ctrl-btn wa" onclick="shareApp()">📲</button>
        </div>
    </div>
</header>

<div class="timer-banner">
    <span id="timerLabel">⚡ फ्लॅश डील संपण्यास वेळ:</span>
    <span class="timer-box" id="countdown">01:59:59</span>
</div>

<div class="search-box">
    <input type="text" id="searchInput" onkeyup="filterApps()" placeholder="अ‍ॅप किंवा ऑफर शोधा (Zomato, Blinkit, 50% OFF)...">
</div>

<!-- १. होम विभाग -->
<div id="appsSection" class="section active">
    <div class="tabs">
        <button class="tab-btn active" onclick="filterCategory('all', this)">सर्व (All)</button>
        <button class="tab-btn" onclick="filterCategory('top', this)">🔥 जास्त ऑफर्स</button>
